<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Choosely</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('decision_generator_state');
          var settings = raw ? JSON.parse(raw).settings : null;
          var mode =
            settings && settings.themeMode === 'dark'
              ? 'dark'
              : settings && settings.themeMode === 'light'
              ? 'light'
              : settings && settings.darkMode
              ? 'dark'
              : 'light';
          var isDark = mode === 'dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
          if (isDark) root.classList.add('dark');
          else root.classList.remove('dark');
          if (settings && settings.animations === false) {
            root.setAttribute('data-animations', 'false');
          } else {
            root.setAttribute('data-animations', 'true');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-full bg-surface text-on-surface font-sans antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
